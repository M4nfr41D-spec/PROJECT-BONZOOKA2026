<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BONZOOKAA Balance Simulator v2.16</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0e1a; color:#c8d0e0; font-family:'Segoe UI',system-ui,sans-serif; font-size:13px; }
  .container { max-width:1400px; margin:0 auto; padding:16px; }
  h1 { color:#00d4ff; font-size:20px; margin-bottom:8px; }
  h2 { color:#ffaa00; font-size:14px; margin:12px 0 6px; border-bottom:1px solid #222; padding-bottom:4px; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; padding:10px; background:#111622; border:1px solid #1a2040; border-radius:6px; }
  .ctrl-group { display:flex; flex-direction:column; gap:2px; }
  .ctrl-group label { font-size:10px; color:#888; text-transform:uppercase; letter-spacing:0.5px; }
  .ctrl-group input, .ctrl-group select { background:#0d1220; border:1px solid #2a3050; color:#fff; padding:4px 8px; border-radius:4px; font-size:12px; width:110px; }
  button { padding:6px 16px; background:#00aadd; color:#fff; border:none; border-radius:4px; cursor:pointer; font-weight:600; font-size:12px; }
  button:hover { background:#00ccff; }
  button.danger { background:#dd3344; }
  .output { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
  .panel { background:#111622; border:1px solid #1a2040; border-radius:6px; padding:10px; max-height:600px; overflow-y:auto; }
  .panel.full { grid-column:1/-1; }
  table { width:100%; border-collapse:collapse; font-size:11px; }
  th { background:#0d1220; color:#ffaa00; padding:4px 6px; text-align:left; position:sticky; top:0; }
  td { padding:3px 6px; border-bottom:1px solid #1a2040; }
  tr:hover td { background:rgba(0,170,255,0.05); }
  .bar { height:8px; background:#1a2040; border-radius:4px; position:relative; }
  .bar-fill { height:100%; border-radius:4px; transition:width 0.2s; }
  .warn { color:#ff6644; }
  .ok { color:#44ff66; }
  .muted { color:#556; }
  canvas { width:100%; height:250px; background:#0d1220; border-radius:6px; }
  .stat-row { display:flex; justify-content:space-between; padding:2px 0; }
  .stat-label { color:#888; }
  .stat-val { color:#fff; font-family:monospace; }
  .alert { padding:6px 10px; margin:4px 0; border-radius:4px; font-size:11px; }
  .alert-warn { background:rgba(255,100,0,0.1); border:1px solid rgba(255,100,0,0.3); color:#ff8844; }
  .alert-crit { background:rgba(255,30,50,0.1); border:1px solid rgba(255,30,50,0.3); color:#ff3344; }
  .alert-ok { background:rgba(0,255,100,0.1); border:1px solid rgba(0,255,100,0.3); color:#44ff88; }
  #log { font-family:monospace; font-size:10px; white-space:pre-wrap; max-height:400px; overflow-y:auto; background:#080c16; padding:8px; border-radius:4px; }
</style>
</head>
<body>
<div class="container">
  <h1>⚖️ BONZOOKAA Balance Simulator</h1>
  <p style="color:#666;font-size:11px;margin-bottom:8px;">Automated zone 1–500 progression validation. Simulates player power vs enemy scaling per zone.</p>
  
  <div class="controls">
    <div class="ctrl-group">
      <label>Max Zone</label>
      <input type="number" id="maxZone" value="500" min="10" max="2000">
    </div>
    <div class="ctrl-group">
      <label>Difficulty</label>
      <select id="difficulty">
        <option value="normal">Normal</option>
        <option value="risk">Risk</option>
        <option value="chaos">Chaos</option>
      </select>
    </div>
    <div class="ctrl-group">
      <label>Corruption</label>
      <input type="number" id="corruption" value="0" min="0" max="10">
    </div>
    <div class="ctrl-group">
      <label>Prestige Lv</label>
      <input type="number" id="prestige" value="0" min="0" max="7">
    </div>
    <div class="ctrl-group">
      <label>Pilot Stat Pts</label>
      <input type="number" id="pilotPts" value="0" min="0" max="500">
    </div>
    <div class="ctrl-group">
      <label>Avg Item iLvl</label>
      <input type="number" id="avgIlvl" value="1" min="1" max="500">
    </div>
    <div class="ctrl-group">
      <label>Avg Rarity</label>
      <select id="avgRarity">
        <option value="common">Common</option>
        <option value="uncommon">Uncommon</option>
        <option value="rare" selected>Rare</option>
        <option value="epic">Epic</option>
        <option value="legendary">Legendary</option>
        <option value="mythic">Mythic</option>
      </select>
    </div>
    <div class="ctrl-group">
      <label>&nbsp;</label>
      <button onclick="runSim()">▶ RUN SIM</button>
    </div>
    <div class="ctrl-group">
      <label>&nbsp;</label>
      <button class="danger" onclick="clearOutput()">CLEAR</button>
    </div>
  </div>

  <div class="output">
    <div class="panel" id="summaryPanel">
      <h2>Summary</h2>
      <div id="summary">Run simulation to see results.</div>
    </div>
    <div class="panel" id="alertPanel">
      <h2>Balance Alerts</h2>
      <div id="alerts"></div>
    </div>
    <div class="panel full">
      <h2>Power Curves</h2>
      <canvas id="chart"></canvas>
    </div>
    <div class="panel full" style="max-height:500px;">
      <h2>Zone-by-Zone Breakdown</h2>
      <div id="tableWrap"></div>
    </div>
    <div class="panel full">
      <h2>Simulation Log</h2>
      <div id="log"></div>
    </div>
  </div>
</div>

<script>
// ============================================================
// BALANCE MODEL — mirrors BONZOOKAA's actual formulas
// ============================================================

const RARITY_MULT = { common:1, uncommon:1.3, rare:1.7, epic:2.2, legendary:3.0, mythic:4.5 };
const TIER_DATA = [
  { id:'tier1', name:'Asteroid Belt',    zoneStart:1,   zoneEnd:100,  hpMult:1.0, dmgMult:1.0, loot:1.0 },
  { id:'tier2', name:'Nebula Expanse',   zoneStart:101, zoneEnd:250,  hpMult:1.5, dmgMult:1.3, loot:1.2 },
  { id:'tier3', name:'Void Rift',        zoneStart:251, zoneEnd:400,  hpMult:2.5, dmgMult:1.8, loot:1.5 },
  { id:'tier4', name:'Derelict Fleet',   zoneStart:401, zoneEnd:600,  hpMult:4.0, dmgMult:2.5, loot:2.0 },
  { id:'tier5', name:'Black Hole',       zoneStart:601, zoneEnd:9999, hpMult:6.0, dmgMult:3.5, loot:3.0 }
];
const DIFF_MULTS = {
  normal: { hp:1.0, dmg:1.0, loot:1.0, eliteMult:1.0 },
  risk:   { hp:1.3, dmg:1.2, loot:1.5, eliteMult:3.0 },
  chaos:  { hp:3.0, dmg:2.0, loot:3.0, eliteMult:5.0 }
};
const PRESTIGE_BONUSES = [
  { damage:0,  maxHP:0,  luck:0  },
  { damage:10, maxHP:10, luck:5  },
  { damage:20, maxHP:20, luck:10 },
  { damage:35, maxHP:35, luck:15 },
  { damage:50, maxHP:50, luck:25 },
  { damage:75, maxHP:75, luck:40 },
  { damage:100,maxHP:100,luck:60 },
  { damage:150,maxHP:150,luck:100}
];

function getTier(zone) {
  return TIER_DATA.find(t => zone >= t.zoneStart && zone <= t.zoneEnd) || TIER_DATA[4];
}

// --- PLAYER POWER MODEL ---
function calcPlayerPower(zone, params) {
  const level = Math.min(100, Math.floor(10 + zone * 0.5));
  const pilotDmgPct = params.pilotPts * 2;  // ~2% per point
  const pilotHPPct = params.pilotPts * 3;
  const rarMult = RARITY_MULT[params.avgRarity] || 1.7;
  const ilvlScale = Math.max(1, params.avgIlvl + zone * 0.3);
  
  const baseDmg = 12 + level * 1.5;
  const gearDmg = baseDmg * (ilvlScale * 0.05) * rarMult;
  const prestigeDmg = PRESTIGE_BONUSES[params.prestige]?.damage || 0;
  
  const totalDmg = (baseDmg + gearDmg) * (1 + pilotDmgPct/100) * (1 + prestigeDmg/100);
  
  const baseHP = 100 + level * 8;
  const gearHP = baseHP * (ilvlScale * 0.03) * rarMult;
  const prestigeHP = PRESTIGE_BONUSES[params.prestige]?.maxHP || 0;
  
  const totalHP = (baseHP + gearHP) * (1 + pilotHPPct/100) * (1 + prestigeHP/100);
  
  const fireRate = 2 + Math.min(5, level * 0.02 + ilvlScale * 0.01);
  const dps = totalDmg * fireRate;
  
  return { level, totalDmg, totalHP, fireRate, dps, gearDmg, pilotDmgPct, prestigeDmg };
}

// --- ENEMY POWER MODEL ---
function calcEnemyPower(zone, params) {
  const tier = getTier(zone);
  const diff = DIFF_MULTS[params.difficulty] || DIFF_MULTS.normal;
  const corr = params.corruption || 0;
  
  const baseHP = 30 + zone * 4;
  const baseDmg = 8 + zone * 1.5;
  
  const enemyHP = baseHP * tier.hpMult * diff.hp * (1 + corr * 0.15);
  const enemyDmg = baseDmg * tier.dmgMult * diff.dmg * (1 + corr * 0.10);
  
  const eliteHP = enemyHP * 5;
  const eliteDmg = enemyDmg * 2.5;
  
  const bossHP = enemyHP * 30;
  const bossDmg = enemyDmg * 4;
  
  return { tier, enemyHP, enemyDmg, eliteHP, eliteDmg, bossHP, bossDmg };
}

// --- TTK ANALYSIS ---
function calcTTK(playerDPS, enemyHP) {
  return enemyHP / Math.max(1, playerDPS);
}

function calcSurvival(playerHP, enemyDPS) {
  return playerHP / Math.max(1, enemyDPS);
}

// ============================================================
// SIMULATION ENGINE
// ============================================================

function runSim() {
  const params = {
    maxZone: parseInt(document.getElementById('maxZone').value) || 500,
    difficulty: document.getElementById('difficulty').value,
    corruption: parseInt(document.getElementById('corruption').value) || 0,
    prestige: parseInt(document.getElementById('prestige').value) || 0,
    pilotPts: parseInt(document.getElementById('pilotPts').value) || 0,
    avgIlvl: parseInt(document.getElementById('avgIlvl').value) || 1,
    avgRarity: document.getElementById('avgRarity').value
  };
  
  const results = [];
  const alerts = [];
  const log = [];
  const step = Math.max(1, Math.floor(params.maxZone / 100));
  
  log.push(`[SIM] BONZOOKAA Balance Sim — ${params.difficulty.toUpperCase()} | Corruption ${params.corruption} | Prestige ${params.prestige}`);
  log.push(`[SIM] Pilot: ${params.pilotPts} stat pts | Avg iLvl: ${params.avgIlvl} | Rarity: ${params.avgRarity}`);
  log.push(`[SIM] Zones: 1–${params.maxZone} (step ${step})`);
  log.push('');
  
  let prevTier = null;
  
  for (let z = 1; z <= params.maxZone; z += step) {
    const player = calcPlayerPower(z, params);
    const enemy = calcEnemyPower(z, params);
    
    const ttkNormal = calcTTK(player.dps, enemy.enemyHP);
    const ttkElite = calcTTK(player.dps, enemy.eliteHP);
    const ttkBoss = calcTTK(player.dps, enemy.bossHP);
    const survNormal = calcSurvival(player.totalHP, enemy.enemyDmg);
    const survBoss = calcSurvival(player.totalHP, enemy.bossDmg);
    
    const powerRatio = player.dps / Math.max(1, enemy.enemyDmg);
    
    results.push({
      zone: z,
      tier: enemy.tier.name,
      playerDPS: player.dps,
      playerHP: player.totalHP,
      playerLevel: player.level,
      enemyHP: enemy.enemyHP,
      enemyDmg: enemy.enemyDmg,
      eliteHP: enemy.eliteHP,
      bossHP: enemy.bossHP,
      ttkNormal, ttkElite, ttkBoss,
      survNormal, survBoss,
      powerRatio
    });
    
    // Tier transition logging
    if (enemy.tier.name !== prevTier) {
      log.push(`[T+Z${z}] TIER: ${enemy.tier.name} (HP×${enemy.tier.hpMult} DMG×${enemy.tier.dmgMult})`);
      prevTier = enemy.tier.name;
    }
    
    // Balance alerts
    if (ttkNormal > 8) {
      alerts.push({ zone:z, severity:'warn', msg:`Z${z}: Normal TTK=${ttkNormal.toFixed(1)}s — enemies feel spongy` });
    }
    if (ttkNormal > 15) {
      alerts.push({ zone:z, severity:'crit', msg:`Z${z}: Normal TTK=${ttkNormal.toFixed(1)}s — WALL: enemies too tanky` });
    }
    if (ttkBoss > 120) {
      alerts.push({ zone:z, severity:'crit', msg:`Z${z}: Boss TTK=${ttkBoss.toFixed(0)}s — boss fight too long (>2min)` });
    }
    if (survNormal < 3) {
      alerts.push({ zone:z, severity:'warn', msg:`Z${z}: Survival=${survNormal.toFixed(1)}s — player dies in <3s to normal enemies` });
    }
    if (survBoss < 1) {
      alerts.push({ zone:z, severity:'crit', msg:`Z${z}: Boss survival=${survBoss.toFixed(1)}s — instant death` });
    }
    if (powerRatio > 50) {
      alerts.push({ zone:z, severity:'warn', msg:`Z${z}: Power ratio ${powerRatio.toFixed(0)}× — player overpowered, no challenge` });
    }
    if (powerRatio < 0.5) {
      alerts.push({ zone:z, severity:'crit', msg:`Z${z}: Power ratio ${powerRatio.toFixed(2)}× — player severely underpowered` });
    }
  }
  
  // Render results
  renderSummary(results, params);
  renderAlerts(alerts);
  renderChart(results);
  renderTable(results);
  document.getElementById('log').textContent = log.join('\n');
}

// ============================================================
// RENDERING
// ============================================================

function renderSummary(results, params) {
  const first = results[0];
  const mid = results[Math.floor(results.length/2)];
  const last = results[results.length-1];
  
  const wallZone = results.find(r => r.ttkNormal > 15);
  const deathZone = results.find(r => r.survNormal < 1);
  const trivialZone = results.find(r => r.powerRatio > 100);
  
  let html = '';
  html += '<div class="stat-row"><span class="stat-label">Start DPS</span><span class="stat-val">' + first.playerDPS.toFixed(0) + '</span></div>';
  html += '<div class="stat-row"><span class="stat-label">Mid DPS (Z' + mid.zone + ')</span><span class="stat-val">' + mid.playerDPS.toFixed(0) + '</span></div>';
  html += '<div class="stat-row"><span class="stat-label">End DPS (Z' + last.zone + ')</span><span class="stat-val">' + last.playerDPS.toFixed(0) + '</span></div>';
  html += '<hr style="border:none;border-top:1px solid #222;margin:6px 0;">';
  html += '<div class="stat-row"><span class="stat-label">Start HP</span><span class="stat-val">' + first.playerHP.toFixed(0) + '</span></div>';
  html += '<div class="stat-row"><span class="stat-label">End HP</span><span class="stat-val">' + last.playerHP.toFixed(0) + '</span></div>';
  html += '<hr style="border:none;border-top:1px solid #222;margin:6px 0;">';
  html += '<div class="stat-row"><span class="stat-label">Power Growth</span><span class="stat-val">' + (last.playerDPS / first.playerDPS).toFixed(1) + '×</span></div>';
  html += '<div class="stat-row"><span class="stat-label">Enemy Growth</span><span class="stat-val">' + (last.enemyHP / first.enemyHP).toFixed(1) + '×</span></div>';
  html += '<hr style="border:none;border-top:1px solid #222;margin:6px 0;">';
  
  if (wallZone) {
    html += '<div class="stat-row"><span class="stat-label warn">⚠ Wall Zone</span><span class="stat-val warn">Z' + wallZone.zone + '</span></div>';
  } else {
    html += '<div class="stat-row"><span class="stat-label ok">✓ No Wall</span><span class="stat-val ok">Clear to Z' + last.zone + '</span></div>';
  }
  if (deathZone) {
    html += '<div class="stat-row"><span class="stat-label warn">💀 Death Zone</span><span class="stat-val warn">Z' + deathZone.zone + '</span></div>';
  }
  if (trivialZone) {
    html += '<div class="stat-row"><span class="stat-label muted">😴 Trivial From</span><span class="stat-val muted">Z' + trivialZone.zone + '</span></div>';
  }
  
  document.getElementById('summary').innerHTML = html;
}

function renderAlerts(alerts) {
  if (alerts.length === 0) {
    document.getElementById('alerts').innerHTML = '<div class="alert alert-ok">✓ No balance issues detected in simulated range.</div>';
    return;
  }
  
  // Deduplicate nearby alerts
  const deduped = [];
  let lastZone = -100;
  for (const a of alerts) {
    if (a.zone - lastZone >= 10 || a.severity !== deduped[deduped.length-1]?.severity) {
      deduped.push(a);
      lastZone = a.zone;
    }
  }
  
  const html = deduped.slice(0, 20).map(a => 
    `<div class="alert alert-${a.severity}">${a.msg}</div>`
  ).join('');
  
  document.getElementById('alerts').innerHTML = html + 
    (deduped.length > 20 ? `<div class="muted">...and ${deduped.length - 20} more alerts</div>` : '');
}

function renderChart(results) {
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  
  canvas.width = canvas.offsetWidth * dpr;
  canvas.height = 250 * dpr;
  ctx.scale(dpr, dpr);
  
  const w = canvas.offsetWidth;
  const h = 250;
  const pad = { top:20, right:60, bottom:30, left:60 };
  const plotW = w - pad.left - pad.right;
  const plotH = h - pad.top - pad.bottom;
  
  ctx.fillStyle = '#0d1220';
  ctx.fillRect(0, 0, w, h);
  
  // Normalize to log scale
  const maxDPS = Math.max(...results.map(r => r.playerDPS));
  const maxEHP = Math.max(...results.map(r => r.enemyHP));
  const maxVal = Math.max(maxDPS, maxEHP);
  const logMax = Math.log10(Math.max(10, maxVal));
  
  function toY(val) {
    if (val <= 0) return pad.top + plotH;
    const logV = Math.log10(Math.max(1, val));
    return pad.top + plotH - (logV / logMax) * plotH;
  }
  function toX(i) {
    return pad.left + (i / (results.length - 1)) * plotW;
  }
  
  // Grid
  ctx.strokeStyle = '#1a2040';
  ctx.lineWidth = 0.5;
  for (let e = 1; e <= Math.ceil(logMax); e++) {
    const y = toY(Math.pow(10, e));
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(w - pad.right, y); ctx.stroke();
    ctx.fillStyle = '#556';
    ctx.font = '9px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('10^' + e, pad.left - 4, y + 3);
  }
  
  // Player DPS line
  ctx.strokeStyle = '#00ccff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  results.forEach((r, i) => {
    const x = toX(i); const y = toY(r.playerDPS);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();
  
  // Enemy HP line
  ctx.strokeStyle = '#ff4466';
  ctx.lineWidth = 2;
  ctx.beginPath();
  results.forEach((r, i) => {
    const x = toX(i); const y = toY(r.enemyHP);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();
  
  // Player HP line
  ctx.strokeStyle = '#44ff66';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4,3]);
  ctx.beginPath();
  results.forEach((r, i) => {
    const x = toX(i); const y = toY(r.playerHP);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();
  ctx.setLineDash([]);
  
  // TTK line (seconds, different scale)
  const maxTTK = Math.max(...results.map(r => r.ttkNormal));
  ctx.strokeStyle = '#ffaa00';
  ctx.lineWidth = 1;
  ctx.setLineDash([2,2]);
  ctx.beginPath();
  results.forEach((r, i) => {
    const x = toX(i);
    const y = pad.top + plotH - (Math.min(r.ttkNormal, 30) / 30) * plotH;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();
  ctx.setLineDash([]);
  
  // Zone labels
  ctx.fillStyle = '#556';
  ctx.font = '9px sans-serif';
  ctx.textAlign = 'center';
  const labelStep = Math.max(1, Math.floor(results.length / 8));
  for (let i = 0; i < results.length; i += labelStep) {
    ctx.fillText('Z' + results[i].zone, toX(i), h - 8);
  }
  
  // Legend
  const leg = [
    { color:'#00ccff', label:'Player DPS' },
    { color:'#ff4466', label:'Enemy HP' },
    { color:'#44ff66', label:'Player HP' },
    { color:'#ffaa00', label:'TTK (s)' }
  ];
  leg.forEach((l, i) => {
    const lx = w - pad.right + 4;
    const ly = pad.top + 12 + i * 14;
    ctx.fillStyle = l.color;
    ctx.fillRect(lx, ly - 4, 8, 8);
    ctx.fillStyle = '#aaa';
    ctx.font = '9px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(l.label, lx + 12, ly + 3);
  });
}

function renderTable(results) {
  let html = '<table><thead><tr>';
  html += '<th>Zone</th><th>Tier</th><th>Lv</th><th>P.DPS</th><th>P.HP</th>';
  html += '<th>E.HP</th><th>E.DMG</th><th>TTK</th><th>E.TTK</th><th>B.TTK</th>';
  html += '<th>Surv</th><th>Ratio</th>';
  html += '</tr></thead><tbody>';
  
  for (const r of results) {
    const ttkClass = r.ttkNormal > 15 ? 'warn' : r.ttkNormal > 8 ? '' : 'ok';
    const survClass = r.survNormal < 3 ? 'warn' : r.survNormal < 1 ? 'warn' : 'ok';
    
    html += '<tr>';
    html += `<td>${r.zone}</td>`;
    html += `<td style="color:#ffaa00;font-size:9px;">${r.tier.split(' ')[0]}</td>`;
    html += `<td>${r.playerLevel}</td>`;
    html += `<td>${fmt(r.playerDPS)}</td>`;
    html += `<td>${fmt(r.playerHP)}</td>`;
    html += `<td>${fmt(r.enemyHP)}</td>`;
    html += `<td>${fmt(r.enemyDmg)}</td>`;
    html += `<td class="${ttkClass}">${r.ttkNormal.toFixed(1)}s</td>`;
    html += `<td>${r.ttkElite.toFixed(1)}s</td>`;
    html += `<td>${r.ttkBoss.toFixed(0)}s</td>`;
    html += `<td class="${survClass}">${r.survNormal.toFixed(1)}s</td>`;
    html += `<td>${r.powerRatio.toFixed(1)}×</td>`;
    html += '</tr>';
  }
  
  html += '</tbody></table>';
  document.getElementById('tableWrap').innerHTML = html;
}

function fmt(n) {
  if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return Math.round(n).toString();
}

function clearOutput() {
  document.getElementById('summary').innerHTML = 'Run simulation to see results.';
  document.getElementById('alerts').innerHTML = '';
  document.getElementById('tableWrap').innerHTML = '';
  document.getElementById('log').textContent = '';
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

// Auto-run on load
window.addEventListener('load', () => setTimeout(runSim, 100));
</script>
</body>
</html>
