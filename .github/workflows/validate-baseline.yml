name: Validate baseline

on:
  push:
    branches:
      - main
      - recovery/a60-candidate
  pull_request:

permissions:
  contents: read

jobs:
  structural-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate BONZOOKA baseline
        run: node scripts/validate-baseline.mjs
